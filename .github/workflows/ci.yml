name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv (Python 3.13)
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Set up X display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
        shell: bash

      # El test 'uses_pynput_off_wayland' fija DISPLAY=:0 y necesita un X
      # real para que pynput arranque; por eso forzamos Xvfb en :0.
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -n 0 -s "-screen 0 1280x1024x24" uv run pytest -v
        shell: bash

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: uv run pytest -v
        shell: pwsh
