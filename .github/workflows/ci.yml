name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + tipos)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci && npm run build
        run: |
          npm ci
          npm run build
        working-directory: frontend
        shell: bash

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv (Python 3.13)
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Set up X display and Qt system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
        shell: bash

      # El test 'uses_pynput_off_wayland' fija DISPLAY=:0 y necesita un X
      # real para que pynput arranque; por eso forzamos Xvfb en :0.
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -n 0 -s "-screen 0 1280x1024x24" uv run pytest -v
        shell: bash

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: uv run pytest -v
        shell: pwsh
