[project]
name = "ptz-controller"
version = "0.3.2"
description = "Controlador universal de cámaras PTZ ONVIF (teclado, gamepad, interfaz PySide6)"
readme = "README.md"
authors = [
    { name = "Jose Rico", email = "josearudeveloper@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "onvif-zeep>=0.2.12",
    "pygame>=2.6",
    "pynput>=1.8",
    "PySide6>=6.8",
    "PyYAML>=6.0",
    "opencv-python>=4.10",
    "pywebview>=6.2.1",
    # Backend GTK de pywebview, solo en Linux (Windows usa Edge WebView2 vía
    # su propio backend, y pygobject no se instala igual ahí). Requiere
    # las cabeceras de desarrollo del sistema (gobject-introspection-devel,
    # cairo-gobject-devel, python3-devel o equivalentes) para compilarse.
    "pygobject>=3.58.0; sys_platform == 'linux'",
    "pycairo>=1.29.1; sys_platform == 'linux'",
]

[project.scripts]
ptz-controller = "main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.11",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
