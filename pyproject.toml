[project]
name = "ptz-controller"
version = "0.4.4"
description = "Controlador universal de cámaras PTZ ONVIF (teclado, gamepad, interfaz web con React)"
readme = "README.md"
authors = [
    { name = "Jose Rico", email = "josearudeveloper@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "onvif-zeep>=0.2.12",
    "pygame>=2.6",
    "pynput>=1.8",
    "PyYAML>=6.0",
    "opencv-python>=4.10",
    "pywebview>=6.2.1",
]

[project.scripts]
ptz-controller = "main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.11",
]
# Backend GTK de pywebview, solo en Linux (Windows usa Edge WebView2 vía su
# propio backend). Aparte de "dependencies" a propósito: requiere cabeceras
# de desarrollo del sistema (gobject-introspection-devel/
# libgirepository*-dev, cairo-gobject-devel/libcairo2-dev, python3-devel)
# que la CI de tests no tiene por qué instalar solo para que "uv sync"
# resuelva — pytest no importa pywebview/gi en ningún punto. Necesario
# para ejecutar la app en desarrollo y para empaquetar
# (packaging/build.py).
gtk = [
    "pygobject>=3.58.0; sys_platform == 'linux'",
    "pycairo>=1.29.1; sys_platform == 'linux'",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
